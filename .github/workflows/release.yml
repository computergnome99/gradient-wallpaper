name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    name: Test release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
            asset: gradient-wallpaper-linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            asset: gradient-wallpaper-linux-aarch64
          - runner: windows-latest
            platform: windows
            arch: x86_64
            asset: gradient-wallpaper-windows-x86_64.exe
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            asset: gradient-wallpaper-macos-x86_64
          - runner: macos-latest
            platform: macos
            arch: arm64
            asset: gradient-wallpaper-macos-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build standalone executable
        run: python build.py
      - name: Name release asset
        env:
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          python -c "import os, shutil; from pathlib import Path; source = Path('dist') / ('gradient-wallpaper.exe' if os.name == 'nt' else 'gradient-wallpaper'); shutil.copy2(source, Path('dist') / os.environ['ASSET_NAME'])"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes
